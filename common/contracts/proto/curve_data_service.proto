syntax = "proto3";

option csharp_namespace = "GPM.PriceService.Valuation.App.Services";
package curvedataservice;

// ==================================================================
//  SERVICE DEFINITION
// ==================================================================
service CurveDataService {
  rpc SendCurveData (CurveDataRequest) returns (DataResponse);
  rpc StreamCurveData (stream CurveDataChunk) returns (DataResponse);

  rpc SendSimulationData (SimulationDataRequest) returns (DataResponse);
  rpc StreamSimulationData (stream SimulationDataChunk) returns (DataResponse);

  rpc GetStats (StatsRequest) returns (DataResponse);
  rpc WaitCalculationCompleted(WaitCalculationRequest) returns (WaitCalculationResponse);
  rpc CalculateAdHoc (AdHocCalculationRequest) returns (AdHocCalculationResponse);
}


// ==================================================================
//  LEGACY / NON-SIMULATION STRUCTS (unchanged)
// ==================================================================

message CurveDataPoint {
  int64 report_date   = 1;
  int64 observ_date   = 2;
  int64 valuation_date = 3;
  double value        = 4;

  string curve_name   = 5;
  string scenario_name = 6;
  string extra_info    = 7;
}

message CurveData {
  string curve_name = 1;
  int64 observation_date = 2;
  repeated CurveDataPoint points = 3;
  map<string, string> metadata = 4;
}

message CurveDataRequest {
  string request_id = 1;
  repeated CurveData curves = 2;
  map<string, string> metadata = 3;
}

message CurveDataChunk {
  string request_id = 1;
  int32 chunk_index = 2;

  repeated CurveDataPoint points = 3; // legacy/non-simulation only

  bool is_last_chunk = 4;
  int32 total_chunks = 5;
}


// ==================================================================
//  SHARED STRUCTS
// ==================================================================

message StatsRequest {
  string request_id = 1;
}

message DataResponse {
  string request_id = 1;
  string status = 2;
  string message = 3;
  int32 processed_count = 4;
  int32 total_received = 5;
}


// ==================================================================
//  SIMULATION STRUCTS (FLATTENED / OPTIMIZED)
// ==================================================================

// A curve represented by *flat arrays* instead of millions of CurveDataPoint
message SimulationCurveData {
  string curve_name = 1;

  // Flattened representation
  repeated int64 dates  = 2;     // ordinal dates
  repeated double values = 3;    // simulation values, length == dates.length

  map<string, string> metadata = 4;
}


// Data for one simulation
message SimulationData {
  string request_id = 1;
  int32 simulation_index = 2;

  // Each simulation has multiple curves
  repeated SimulationCurveData curves = 3;

  map<string, string> metadata = 4;
}


// Chunk with multiple simulations
message SimulationDataChunk {
  string request_id = 1;

  repeated SimulationData simulations = 2;

  map<string, string> metadata = 3;
}


// Non-streaming version
message SimulationDataRequest {
  string request_id = 1;
  repeated SimulationData simulations = 2;
  map<string, string> metadata = 3;
}

message WaitCalculationRequest {
  string request_id = 1;
  int64 timeout_sec = 2;
}

message WaitCalculationResponse {
  bool success = 1;
  string status = 2;   // COMPLETED / FAILED / TIMEOUT / NOT_FOUND
  string message = 3;
}

// Isolated, non-persistent calculation requested by an internal caller.
message AdHocCalculationRequest {
  string request_id = 1;
  string operation_id = 2;
  string operation_kind = 3;
  string definition_json = 4;
  int32 samples_from = 5;
  int32 samples_count = 6;
  int64 observation_date = 7;
  int64 valuation_start_date = 8;
  int64 valuation_end_date = 9;
  string scenario = 10;
  string valuation_type = 11;
}

message AdHocCalculationEntry {
  int32 sample_index = 1;
  double value = 2;
}

message AdHocCalculationResponse {
  string request_id = 1;
  string operation_id = 2;
  string result_kind = 3;
  string unit = 4;
  repeated AdHocCalculationEntry entries = 5;
  string status = 6;
  string message = 7;
}
