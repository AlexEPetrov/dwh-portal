services:
  postgres:
    image: postgres:14.8-alpine3.18
    container_name: price-valuation-db
    environment:
      POSTGRES_DB: "app_gtrm"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: "/var/lib/postgresql/data/pgdata"
      DB_USER: $PSG_USER
      DB_PASSWORD: $PSG_PASS
      DB_PORT: $PSG_PORT
      DB_HOST: $PSG_HOST
    volumes:
      - ./migrations:/migrations
      - ./database:/database
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_gtrm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G

