[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
# Same line length as Black. Do not override this in editor settings.
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["api", "domains", "shared", "infrastructure"]
