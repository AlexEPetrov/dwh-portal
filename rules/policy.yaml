version: 1
approval:
  autonomous:
    rank: 10
  workflow_allowed:
    rank: 20
  human_required:
    rank: 30
resolution:
  effective_policy: max(change_class, topic, contract)
  escalation_only_during_task: true
  missing_required_evidence: MISSING_EVIDENCE
change_classes:
  presentation_only:
    approval: autonomous
    when:
    - no_business_semantic_change
    - no_public_contract_change
  documentation_nonsemantic:
    approval: autonomous
    when:
    - no_authority_or_semantic_change
  mechanical_refactor:
    approval: workflow_allowed
    when:
    - behavior_preserved
  generated_regeneration:
    approval: workflow_allowed
    when:
    - authoring_source_approved_or_unchanged
  public_api_semantic:
    approval: human_required
  shared_python_rust_semantic:
    approval: human_required
  business_or_contract_semantic:
    approval: human_required
topics:
  portal-harness-image:
    paths:
    - infra/images/portal/**
    - backend/core-service/Dockerfile
    - backend/core-service/build_image.sh
    - infra/images/portal-harness/**
    - infra/compose/docker-compose-portal-harness.yml
    - infra/compose/docker-compose-checkout.yml
    - infra/environments/portal-harness/**
    - infra/environments/test/up.sh
    - infra/environments/test/down.sh
    - infra/environments/test/compose.sh
    - infra/scripts/build_env_portal_harness.sh
    - infra/scripts/package_portal_harness_release.py
    - infra/scripts/package_release.py
    - infra/scripts/build_release.py
    - infra/scripts/run_portal_harness_demo.sh
    - infra/scripts/build_env_test.sh
    - infra/scripts/_build_target.sh
    - infra/scripts/tests/**
    - infra/scripts/README.md
    - infra/environments/test/README.md
    - infra/environments/test/.env
    - infra/environments/test/sample.env
    - rules/workflows/portal-harness-image.md
    approval: human_required
    workflow: portal-harness-image
  core-local-environment:
    paths:
    - rules/workflows/core-local-environment.md
    approval: human_required
    workflow: core-local-environment
  catalog:
    paths:
    - backend/core-service/src/api/catalog_mcp.py
    - backend/core-service/src/settings/mcp.py
    - backend/core-service/src/domains/catalog/**
    - backend/core-service/src/api/portal/**
    - frontend/web/src/modules/catalog/**
    spec: openspec/specs/catalog/spec.md
    approval: workflow_allowed
    workflow: api-contract
    contract: http-api
    escalate_if: public_api_shape_or_semantic_change
    escalate_to: human_required
  ingestion:
    paths:
    - backend/core-service/src/domains/catalog/collectors/**
    - backend/core-service/src/domains/catalog/providers/**
    spec: openspec/specs/ingestion/spec.md
    approval: workflow_allowed
    escalate_if: business_semantic_change
    escalate_to: human_required
  market-data-products:
    paths:
    - frontend/web/src/modules/market-data/**
    spec: openspec/specs/market-data-dual-tabs/spec.md
    approval: autonomous
    spec_optional_until_created: true
  curve-availability:
    paths:
    - backend/core-service/src/domains/risk/repositories/curve_data.py
    - backend/core-service/src/domains/risk/repositories/calendar_data.py
    - backend/core-service/src/domains/risk/services/valuation/local/calculators/curve_calculator.py
    - backend/core-service/src/domains/risk/services/valuation/local/calculators/index_calculator.py
    - backend/calc-service/src/services/calculators/curve_calculator.rs
    spec: openspec/specs/curve-availability/spec.md
    approval: workflow_allowed
    workflow: high-risk-semantics
    legacy_evidence:
    - docs/design/business/curve-availability-policy.md
    spec_optional_until_created: true
    escalate_if: business_semantic_change
    escalate_to: human_required
  valuation-contract-filters:
    paths:
    - backend/core-service/src/domains/risk/commands/mappings.py
    - backend/core-service/src/api/valuation/**
    - frontend/web/src/modules/valuations/**
    spec: openspec/specs/valuation-contract-filters/spec.md
    approval: workflow_allowed
    workflow: high-risk-semantics
    legacy_evidence:
    - docs/design/adr/active/api/valuation-contracts-filter.md
    spec_optional_until_created: true
    escalate_if: business_semantic_change
    escalate_to: human_required
  dependency-ordering:
    paths:
    - backend/core-service/src/domains/risk/commands/mappings.py
    - backend/calc-service/src/services/preparation/contract_dependency_service.rs
    spec: openspec/specs/dependency-ordering/spec.md
    approval: workflow_allowed
    workflow: high-risk-semantics
    spec_optional_until_created: true
    escalate_if: business_semantic_change
    escalate_to: human_required
  python-rust-transport:
    paths:
    - common/contracts/proto/**
    - backend/core-service/src/proto/**
    - backend/calc-service/proto/**
    - backend/calc-service/src/generated/**
    spec: openspec/specs/python-rust-transport/spec.md
    approval: workflow_allowed
    workflow: shared-proto
    escalate_if: business_semantic_change
    escalate_to: human_required
    spec_optional_until_created: true
  excel-compatibility:
    paths:
    - backend/core-service/src/domains/management/services/office_interop/**
    spec: openspec/specs/excel-compatibility/spec.md
    approval: workflow_allowed
    workflow: excel-compatibility
    escalate_if: semantic_or_compatibility_change
    escalate_to: human_required
    spec_optional_until_created: true
  http-api-contract:
    paths:
    - backend/core-service/src/api/**
    - common/contracts/openapi/**
    - frontend/web/src/shared/api/generated/**
    spec: openspec/specs/http-api-contract/spec.md
    approval: workflow_allowed
    workflow: api-contract
    contract: http-api
    spec_optional_until_created: true
    escalate_if: public_api_shape_or_semantic_change
    escalate_to: human_required
contracts:
  http-api:
    approval: workflow_allowed
    workflow: api-contract
    chain:
    - role: authoring_source
      paths:
      - backend/core-service/src/api/**
    - role: published_contract
      paths:
      - common/contracts/openapi/openapi.json
      read_only_by_hand: true
    - role: generated_consumer
      paths:
      - frontend/web/src/shared/api/generated/**
      read_only_by_hand: true
    - role: consumer
      paths:
      - frontend/web/**
    reconciliation:
    - when:
      - api_authoring_source_changed
      verification: OPENAPI-EXPORT
    - when:
      - public_api_shape_changed
      - published_openapi_changed
      verification: FRONTEND-GEN-API
    - when:
      - frontend_generated_api_changed
      - frontend_consumer_changed
      verification: FRONTEND-BUILD
    escalate_if: public_api_shape_or_semantic_change
    escalate_to: human_required
  shared-proto:
    approval: workflow_allowed
    workflow: shared-proto
    paths:
    - common/contracts/proto/**
    - backend/core-service/src/proto/**
    - backend/calc-service/proto/**
    - backend/calc-service/src/generated/**
    escalate_if: business_semantic_change
    escalate_to: human_required
verification:
  FRONTEND-CATALOG-NAVIGATION-TESTS:
    run: cd frontend/web && node --import tsx --test tests/catalog-navigation.test.mjs
  PORTAL-ENV-RENAME-HARNESS-SAMPLE:
    run: test ! -e infra/environments/portal-harness/sample.env && test ! -L infra/environments/portal-harness/sample.env && mv -n infra/environments/portal-harness/sql.env.example infra/environments/portal-harness/sample.env
  PORTAL-ENV-PREPARE-PRIVATE-HARNESS:
    run: |
      git check-ignore -q infra/environments/portal-harness/.env && python3 -B - <<'PY'
      import os
      import re
      from pathlib import Path
      source = Path('infra/environments/test/.env')
      destination = Path('infra/environments/portal-harness/.env')
      template = Path('infra/environments/portal-harness/sample.env')
      original = source.read_bytes()
      keys = set(re.findall(rb'^([A-Z][A-Z0-9_]*)=', original, re.M))
      additions = []
      for line in template.read_bytes().splitlines(keepends=True):
          match = re.match(rb'([A-Z][A-Z0-9_]*)=', line)
          if match and match[1] not in keys:
              additions.append(line.rstrip(b'\r\n') + b'\n')
              keys.add(match[1])
      payload = original + (b'' if original.endswith(b'\n') else b'\n')
      payload += b'\n# === 8-9. Harness additions (private configuration) ===\n'
      payload += b'# Shared values above are copied from test; Compose may override fixed runtime values.\n'
      payload += b'# Test host-path inputs do not create mounts in harness Compose.\n'
      payload += b''.join(additions)
      os.umask(0o077)
      with destination.open('xb') as target:
          target.write(payload)
      assert source.read_bytes() == original, 'Source configuration changed concurrently'
      assert destination.read_bytes().startswith(original)
      print('Private harness configuration created with unchanged test baseline plus harness-only additions; no values printed')
      PY
  PORTAL-ENV-ALIGN-TEST-SECTIONS:
    run: |
      python3 -B - <<'PY'
      import re
      from pathlib import Path
      path = Path('infra/environments/test/.env')
      original = path.read_bytes()
      lines = original.splitlines(keepends=True)
      headings = (
          (b'# === 1. Process and HTTP ===', ('ENVIRONMENT', 'APP_API_')),
          (b'# === 2. Portal snapshot store ===', ('APP_PORTAL_',)),
          (b'# === 3. Portal database ===', ('APP_DB_',)),
          (b'# === 4. DWH and lineage ===', ('APP_DWH_',)),
          (b'# === 5. Portal authentication ===', ('APP_AUTH_',)),
          (b'# === 6. Portal AI (legacy) ===', ('APP_AI_',)),
          (b'# === 7. Local paths and mounts ===', ('APP_LOC_',)),
      )
      seen = set()
      result = []
      inserted = []
      newline = b'\r\n' if b'\r\n' in original else b'\n'
      for line in lines:
          match = re.match(rb'([A-Z][A-Z0-9_]*)=', line)
          if match:
              key = match[1].decode('ascii')
              for heading, prefixes in headings:
                  if key.startswith(prefixes) and heading not in seen:
                      seen.add(heading)
                      if heading not in original.splitlines():
                          result.append(heading + newline)
                          inserted.append(len(result) - 1)
                      break
          result.append(line)
      updated = b''.join(result)
      assert b''.join(line for index, line in enumerate(result) if index not in inserted) == original
      if updated != original:
          with path.open('r+b') as target:
              assert target.read() == original, 'Configuration changed concurrently; no write performed'
              target.seek(0)
              target.write(updated)
              target.truncate()
      print('Section headings aligned; all preexisting bytes, assignment values and file permissions preserved')
      PY
  PORTAL-ENV-KEY-INVENTORY:
    run: python3 -B -c "import re; from pathlib import Path; paths=('infra/environments/test/.env','infra/environments/portal-harness/sample.env'); [(print(path), print('\n'.join(re.findall(r'^([A-Z][A-Z0-9_]*)=', Path(path).read_text(), re.M)))) for path in paths]"
  PORTAL-HARNESS-UFW-PG-ALLOW:
    run: sudo ufw allow in proto tcp from 172.19.0.0/16 to 172.17.0.1 port 5432
  PORTAL-HARNESS-UFW-PG-ROLLBACK:
    run: sudo ufw delete allow in proto tcp from 172.19.0.0/16 to 172.17.0.1 port 5432
  PORTAL-HARNESS-NETWORK-ADDRESSING:
    run: docker network inspect dwh-portal-harness_harness --format '{{json .IPAM.Config}}'
  PORTAL-HARNESS-NETWORK-INVENTORY:
    run: docker network inspect $(docker network ls -q) --format '{{.Name}} {{json .IPAM.Config}}'
  PORTAL-HARNESS-HOST-ROUTES:
    run: ip -4 route show table all
  PORTAL-HARNESS-UFW-FIXED-PG-ALLOW:
    run: sudo ufw allow in proto tcp from 172.22.0.0/16 to 172.17.0.1 port 5432
  PORTAL-HARNESS-UFW-FIXED-PG-ROLLBACK:
    run: sudo ufw delete allow in proto tcp from 172.22.0.0/16 to 172.17.0.1 port 5432
  PORTAL-HARNESS-DB-DIAGNOSE:
    run_template: bash infra/environments/portal-harness/diagnose-db.sh "{env_file}"
  PORTAL-HARNESS-DB-SHELL-CHECK:
    run: bash -n infra/environments/portal-harness/diagnose-db.sh
  PORTAL-HARNESS-HOST-PG-LISTENER:
    run: ss -ltn 'sport = :5432'
  PORTAL-HARNESS-STATE:
    run: git status --short
  PORTAL-HARNESS-DOCKER-INSPECT:
    run: docker version && docker image inspect 134/python-builder-313:1.0 134/python-slim-313:1.0 --format '{{.RepoTags}} {{.Id}} {{.Architecture}} {{.Os}}'
  PORTAL-HARNESS-UPSTREAM-RESEARCH:
    run_template: >-
      curl --fail --silent --show-error --location '{url}' -H 'Accept: application/vnd.github.raw+json'
  PORTAL-HARNESS-SOURCE-TESTS:
    run: python3 -B -m unittest discover -s infra/images/portal-harness/tests -v
  PORTAL-HARNESS-YAML-PREREQUISITE:
    run: python3 -B -c "import yaml; print(yaml.__version__)"
  PORTAL-HARNESS-COMPOSE-JSON-BASELINE:
    run: python3 -B -c "import hashlib,json; from pathlib import Path; value=json.loads(Path('infra/compose/docker-compose-portal-harness.json').read_text()); print(hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':')).encode()).hexdigest())"
  INFRA-RELEASE-TESTS:
    run: python3 -B -m unittest discover -s infra/scripts/tests -v
  PORTAL-HARNESS-PRODUCER-MOVE:
    run: >-
      test ! -e infra/scripts/build_env_portal_harness.sh && test ! -L infra/scripts/build_env_portal_harness.sh &&
      test ! -e infra/scripts/package_portal_harness_release.py && test ! -L infra/scripts/package_portal_harness_release.py &&
      test ! -e infra/scripts/run_portal_harness_demo.sh && test ! -L infra/scripts/run_portal_harness_demo.sh &&
      test ! -e infra/scripts/tests/test_release_layout.py && test ! -L infra/scripts/tests/test_release_layout.py &&
      mkdir -p infra/scripts/tests &&
      mv -n infra/environments/portal-harness/build-release.sh infra/scripts/build_env_portal_harness.sh &&
      mv -n infra/images/portal-harness/package_release.py infra/scripts/package_portal_harness_release.py &&
      mv -n infra/environments/portal-harness/run-demo.sh infra/scripts/run_portal_harness_demo.sh &&
      mv -n infra/images/portal-harness/tests/test_release_layout.py infra/scripts/tests/test_release_layout.py
  PORTAL-HARNESS-NODE-INSPECT:
    run: node --version
  PORTAL-HARNESS-NODE-TESTS:
    run: node --test infra/images/portal-harness/tests/test_dsh_parser_loader.mjs infra/images/portal-harness/tests/test_dsh_guard.mjs infra/images/portal-harness/tests/test_dsh_provider_profile.mjs
  PORTAL-HARNESS-SHELL-CHECK:
    run: sh -n infra/images/portal/build.sh && sh -n backend/core-service/build_image.sh && sh -n infra/images/portal-harness/build.sh && sh -n infra/images/portal-harness/smoke.sh && bash -n infra/scripts/run_portal_harness_demo.sh && sh -n infra/images/portal-harness/dsh && bash -n infra/environments/portal-harness/up.sh && bash -n infra/environments/portal-harness/down.sh && bash -n infra/environments/portal-harness/compose.sh && bash -n infra/scripts/build_env_portal_harness.sh && bash -n infra/scripts/build_env_test.sh && bash -n infra/scripts/_build_target.sh && bash -n infra/environments/test/up.sh && bash -n infra/environments/test/down.sh && bash -n infra/environments/test/compose.sh
  PORTAL-BASE-BUILD:
    run: sh infra/images/portal/build.sh
  PORTAL-TEST-RELEASE:
    run: bash infra/scripts/build_env_test.sh
  PORTAL-TEST-RELEASE-OUTPUT:
    run_template: bash infra/scripts/build_env_test.sh "{output_directory}"
  PORTAL-TEST-RELEASE-LOAD:
    run_template: docker load --input "{release_directory}/dwh-portal-core-service.img"
  PORTAL-HARNESS-LAUNCHER-MODES:
    run: chmod +x infra/environments/portal-harness/up.sh infra/environments/portal-harness/down.sh infra/environments/portal-harness/compose.sh infra/scripts/build_env_portal_harness.sh infra/scripts/build_env_test.sh infra/environments/test/up.sh infra/environments/test/down.sh infra/environments/test/compose.sh
  PORTAL-HARNESS-DIFF:
    run: git diff --check && git diff --stat && git status --short
  PORTAL-UNIFICATION-MODES:
    run: git diff --summary && git ls-files --stage backend/core-service/build_image.sh infra/scripts/_build_target.sh infra/scripts/build_env_test.sh infra/images/portal-harness/build.sh && stat -c '%a %n' backend/core-service/build_image.sh infra/scripts/_build_target.sh infra/scripts/build_env_test.sh infra/images/portal-harness/build.sh infra/scripts/build_env_portal_harness.sh infra/environments/portal-harness/up.sh infra/environments/portal-harness/down.sh infra/environments/portal-harness/compose.sh
  PORTAL-UNIFICATION-EXECUTABLES:
    run: chmod +x infra/scripts/_build_target.sh infra/images/portal/build.sh
  PORTAL-HARNESS-BUILD:
    run: sh infra/images/portal-harness/build.sh
  PORTAL-HARNESS-SMOKE:
    run: sh infra/images/portal-harness/smoke.sh
  PORTAL-HARNESS-DEMO:
    run: bash infra/scripts/run_portal_harness_demo.sh
  PORTAL-HARNESS-UP:
    run_template: bash infra/environments/portal-harness/up.sh "{env_file}"
  PORTAL-HARNESS-DOWN:
    run_template: bash infra/environments/portal-harness/down.sh "{env_file}"
  PORTAL-HARNESS-RELEASE:
    run: bash infra/scripts/build_env_portal_harness.sh
  PORTAL-HARNESS-RELEASE-OUTPUT:
    run_template: bash infra/scripts/build_env_portal_harness.sh "{output_directory}"
  PORTAL-HARNESS-RELEASE-LOAD:
    run_template: docker load --input "{release_directory}/dwh-portal-dsh.img"
  OPENSPEC-CHANGE-STATUS:
    run_template: openspec status --change "{change_name}" --json
  OPENSPEC-SPECS-INSTRUCTIONS:
    run_template: openspec instructions specs --change "{change_name}" --json
  OPENSPEC-DESIGN-INSTRUCTIONS:
    run_template: openspec instructions design --change "{change_name}" --json
  OPENSPEC-VALIDATE-SPECS:
    run: openspec validate --specs
  CORE-ENV-INSPECT:
    run: cd backend/core-service && python3 --version && if [ -e .venv ] || [ -L .venv ]; then printf 'Existing .venv must be inspected before reuse\n'; else printf 'No existing .venv\n'; fi
  CORE-ENV-CREATE:
    run: cd backend/core-service && test ! -e .venv && test ! -L .venv && python3 -m venv .venv
  CORE-ENV-PRESERVE-RELOCATED:
    run: cd backend/core-service && test -d .venv && test ! -L .venv && test ! -e .venv.before-fast-load-pages && test ! -L .venv.before-fast-load-pages && mv -T -n .venv .venv.before-fast-load-pages && test ! -e .venv && test ! -L .venv
  CORE-ENV-INSTALL:
    run: cd backend/core-service && .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
  CORE-MCP-DEPENDENCY-RESOLVE:
    run: cd backend/core-service && .venv/bin/python -m pip install --dry-run -r requirements.txt -r requirements-dev.txt
  CORE-MCP-DEPENDENCY-CHECK:
    run: cd backend/core-service && .venv/bin/python -m pip check
  PORTAL-MCP-CONTRACT-DIFF:
    run: git diff -- common/contracts/openapi/openapi.json frontend/web/src/shared/api/generated
  CORE-PYTEST-UNIT:
    run: cd backend/core-service && PYTHONPATH=. .venv/bin/pytest tests/unit/ -v
  CORE-PYTEST-TARGET:
    run_template: cd backend/core-service && PYTHONPATH=. .venv/bin/pytest {test_target}
      -v
  OPENAPI-EXPORT:
    run: cd infra/scripts && bash export_openapi.sh 2>&1 | tail -5
    postconditions:
    - common/contracts/openapi/openapi.json exists
    - inspect expected OpenAPI diff
  FRONTEND-GEN-API:
    run: cd frontend/web && npm run gen-api
  FRONTEND-BUILD:
    run: cd frontend/web && npm run build
  CALC-CARGO-TEST:
    run: cd backend/calc-service && cargo test --all-features
  CALC-CARGO-FMT:
    run: cd backend/calc-service && cargo fmt --check
  CALC-CARGO-CLIPPY:
    run: cd backend/calc-service && cargo clippy --all-targets --all-features -- -D
      warnings
execution:
  closed_world: true
  exact_registered_invocations: true
  preserve_working_tree: true
  unregistered_verification_modalities: forbidden
